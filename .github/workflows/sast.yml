name: SAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    branches:
      - development
    paths:
      - 'Makefile'
      - '.github/workflows/**/*'
      - 'version.go'
      - 'version_test.go'
      - 'go.mod'
      - 'go.sum'
  push:
    branches:
      - development
      - main
    paths:
      - 'Makefile'
      - '.github/workflows/**/*'
      - 'cmd/**/*'
      - 'internal/**/*'
      - 'pkg/**/*'
      - 'go.mod'
      - 'go.sum'
      - 'Docker/**/*'

permissions:
  contents: read

jobs:
  feat-ci-push:
    uses: ghdrope/templates-ci/.github/workflows/go-sast.yml@latest
    permissions:
      contents: read
      security-events: write
