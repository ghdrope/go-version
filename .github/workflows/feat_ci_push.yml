name: Feat CI Push

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'version.go'
      - 'version_test.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/feat_ci_push.yml'

permissions: {}

jobs:
  feat-ci-push:
    uses: ghdrope/templates-ci/.github/workflows/go-feat_ci_push.yml@latest
    permissions:
      contents: read
